services:
  - type: web
    name: promobot-jaz-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn asgi_app:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*' 
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_VOICE_NAME
        value: ""
      - key: FACE_GREETING_IDLE_GUARD_SEC
        value: "5.0"
      - key: ELEVENLABS_MODEL_AR
        value: eleven_flash_v2_5
      - key: ELEVENLABS_VOICE_ID_AR
        value: 9FHjCdVXgA4tYxIYHTcZ
      - key: ENABLE_ELEVENLABS_STREAMING
        value: true
      - key: ROBOT_AI_STREAMING_ENABLED
        value: true
      - key: ROBOT_STRICT_LANGUAGE_LOCK
        value: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ROBOT_WS_TOKEN
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
    disk:
      name: promobot-data
      mountPath: /var/data
      sizeGB: 1
